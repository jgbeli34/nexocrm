name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, ejecutar tests y empaquetar
        run: mvn -B -ntp verify

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-tests
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexocrm-jar
          path: target/nexocrm.jar

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t nexocrm:${{ github.sha }} .
