<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexoCRM · Gestión de ventas</title>
  <meta name="description" content="CRM de gestión de ventas: pipeline, clientes, actividades, analítica comercial e integraciones.">
  <meta name="theme-color" content="#0b7a5e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>

          <rect width="34" height="34" rx="9" fill="#0b7a5e"/>
          <circle cx="11.5" cy="12" r="3.6" fill="#fff"/>
          <circle cx="22.5" cy="22" r="3.6" fill="#e3a03a"/>
          <path d="M11.5 12 C 17 12, 17 22, 22.5 22" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>

        <span class="brand-name">NexoCRM<small>Gestión de ventas</small></span>

      <nav class="nav" aria-label="Secciones">
        <a href="#/panel" data-route="panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg>
          Panel
        </a>
        <a href="#/pipeline" data-route="pipeline">

          Pipeline
        </a>
        <a href="#/clientes" data-route="clientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Clientes
        </a>
        <a href="#/actividades" data-route="actividades">

        </a>
      </nav>

      <div class="sidebar-foot">
        <span class="demo-flag" id="demo-flag" hidden>Modo demo</span>
        <div>Montos guardados en USD.</div>
        <div><a href="swagger-ui.html" id="api-link">Documentación de la API</a></div>

    <main class="main" id="view" tabindex="-1" aria-live="polite"></main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>

</html>
