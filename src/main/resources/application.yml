spring:
  application:
    name: nexocrm
  datasource:
    url: jdbc:h2:mem:nexocrm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nexocrm:
  seed:
    enabled: true
  exchange-rates:
    url: https://open.er-api.com/v6/latest/USD
    cache-ttl: 6h
    timeout: 4s
    fallback:
      USD: 1
      COP: 4050
      MXN: 18.4
      EUR: 0.92
      PEN: 3.75
      CLP: 940
      BRL: 5.4
  webhooks:
    timeout: 5s
    max-attempts: 3

logging:
  level:
    com.nexocrm: INFO
