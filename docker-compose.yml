# Levanta NexoCRM con PostgreSQL:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexocrm
      POSTGRES_USER: nexocrm
      POSTGRES_PASSWORD: nexocrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexocrm"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/nexocrm
      DATABASE_USER: nexocrm
      DATABASE_PASSWORD: nexocrm
    ports:
      - "8080:8080"

volumes:
  pgdata:
